<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD Sniper Trading Journal</title>
<style>
:root{
  --bg:#0b0e14; --bg2:#0f131c; --panel:#131722; --card:#161b27; --card2:#1b2131;
  --border:#242b3a; --border-light:#2f3850;
  --text:#e6e9f0; --text-dim:#8b93a7; --text-mute:#5b6478;
  --gold:#d4af37; --gold-soft:#e8c96a; --gold-dim:#8a7228;
  --green:#26c281; --green-soft:#1c3d31;
  --red:#e5484d; --red-soft:#3d1f22;
  --yellow:#f0b429; --yellow-soft:#3d3419;
  --blue:#4a9eff; --blue-soft:#1a2c42;
  --radius:10px;
  font-size:15px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun","Noto Sans Thai",Arial,sans-serif;
  min-height:100vh;
}
a{color:var(--gold-soft);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{
  width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--border);
  padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px 10px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand-badge{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1608;font-size:15px;flex:0 0 34px;}
.brand-name{font-weight:700;font-size:14.5px;line-height:1.25;}
.brand-sub{font-size:11px;color:var(--text-dim);}
nav.navlist{display:flex;flex-direction:column;gap:2px;}
.navlink{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;border-radius:8px;color:var(--text-dim);text-decoration:none;font-size:13.5px;font-weight:500;
  border:1px solid transparent;
}
.navlink:hover{background:var(--card);color:var(--text);}
.navlink.active{background:var(--card2);color:var(--gold-soft);border-color:var(--border-light);}
.navlink .count{background:var(--border);color:var(--text-dim);font-size:11px;padding:1px 7px;border-radius:20px;}
.navlink.active .count{background:var(--gold-dim);color:#1a1608;}
.nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-mute);margin:16px 10px 6px;}

/* Main */
#main{flex:1;min-width:0;padding:22px 26px 60px;}
.page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.page-title{font-size:20px;font-weight:700;margin:0;}
.page-sub{color:var(--text-dim);font-size:13px;margin-top:3px;}

.btn{
  background:var(--card2);color:var(--text);border:1px solid var(--border-light);border-radius:8px;
  padding:9px 16px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--gold-dim);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#1a1608;border:none;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-danger{background:var(--red-soft);color:#ff9b9e;border:1px solid #5c2a2d;}
.btn-ghost{background:transparent;border:1px solid var(--border);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.card-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:0 0 8px;font-weight:700;}
.card h3{margin:0 0 12px;font-size:14.5px;}

.kpi-label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.kpi-value{font-size:24px;font-weight:800;margin-top:6px;}
.kpi-sub{font-size:12px;color:var(--text-mute);margin-top:4px;}
.pos{color:var(--green);} .neg{color:var(--red);} .neu{color:var(--yellow);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-dim);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tr.row-click{cursor:pointer;}
tr.row-click:hover td{background:var(--card2);}
.table-wrap{overflow-x:auto;}

.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-win{background:var(--green-soft);color:var(--green);}
.badge-loss{background:var(--red-soft);color:#ff9599;}
.badge-be{background:var(--yellow-soft);color:var(--yellow);}
.badge-open{background:var(--blue-soft);color:#8fc4ff;}
.badge-buy{background:var(--green-soft);color:var(--green);}
.badge-sell{background:var(--red-soft);color:#ff9599;}
.tag-chip{display:inline-block;background:var(--card2);border:1px solid var(--border-light);color:var(--text-dim);font-size:11px;padding:2px 8px;border-radius:20px;margin:1px 3px 1px 0;}
.tag-chip.active{background:var(--gold-dim);border-color:var(--gold-dim);color:#1a1608;}

.section-title{font-size:13px;font-weight:700;color:var(--gold-soft);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--border);}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none;}

.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px;}
@media(max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
.field label{display:block;font-size:11.5px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{
  width:100%;background:var(--bg2);border:1px solid var(--border-light);color:var(--text);border-radius:7px;padding:9px 10px;font-size:13.5px;
}
.field textarea{resize:vertical;min-height:60px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold-dim);}
.field.span-2{grid-column:span 2;}
.field.span-4{grid-column:span 4;}
@media(max-width:900px){.field.span-4{grid-column:span 2;}}
@media(max-width:560px){.field.span-2,.field.span-4{grid-column:span 1;}}

.checklist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media(max-width:700px){.checklist{grid-template-columns:repeat(2,1fr);}}
.check-item{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;}
.check-item input{width:16px;height:16px;accent-color:var(--gold);}
.check-item.checked{border-color:var(--gold-dim);background:var(--card2);}

.score-box{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border-light);border-radius:10px;padding:12px 16px;margin-top:8px;flex-wrap:wrap;}
.score-num{font-size:26px;font-weight:800;}
.score-label{font-size:12px;color:var(--text-dim);}
.score-pill{padding:4px 12px;border-radius:20px;font-weight:800;font-size:12.5px;letter-spacing:.02em;}
.pill-a{background:var(--green-soft);color:var(--green);}
.pill-b{background:var(--yellow-soft);color:var(--yellow);}
.pill-no{background:var(--red-soft);color:#ff9599;}

.radio-row{display:flex;gap:8px;}
.radio-row label{flex:1;text-align:center;background:var(--bg2);border:1px solid var(--border-light);border-radius:7px;padding:8px 0;font-size:13px;font-weight:700;color:var(--text-dim);}
.radio-row input{display:none;}
.radio-row input:checked + span{color:var(--gold-soft);}
.radio-row label:has(input:checked){border-color:var(--gold-dim);background:var(--card2);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{background:transparent;border:none;color:var(--text-dim);padding:10px 16px;font-size:13.5px;font-weight:700;border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--gold-soft);border-color:var(--gold);}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:end;}
.filter-bar .field{min-width:130px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state .big{font-size:15px;color:var(--text);font-weight:700;margin-bottom:6px;}

.thumb{width:64px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--border-light);cursor:pointer;}
.shot-preview{max-width:100%;border-radius:8px;border:1px solid var(--border-light);cursor:zoom-in;}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:999;padding:30px;}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--card2);border:1px solid var(--gold-dim);color:var(--text);padding:12px 18px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.4);}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:998;padding:20px;}
.modal-box{background:var(--panel);border:1px solid var(--border-light);border-radius:12px;padding:22px;max-width:420px;width:100%;}
.modal-box h3{margin-top:0;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

.help-text{font-size:12px;color:var(--text-mute);margin-top:4px;line-height:1.5;}
.stat-mini{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.stat-mini:last-child{border-bottom:none;}
.stat-mini b{font-weight:700;}

.psych-chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.psych-chip{background:var(--bg2);border:1px solid var(--border-light);border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--text-dim);}
.psych-chip.on{background:var(--gold-dim);border-color:var(--gold-dim);color:#1a1608;}

#toplogo-mobile{display:none;}
@media(max-width:860px){
  #app{flex-direction:column;}
  #sidebar{width:100%;flex:none;position:relative;height:auto;border-right:none;border-bottom:1px solid var(--border);padding:10px;}
  nav.navlist{flex-direction:row;overflow-x:auto;gap:6px;}
  .navlink{white-space:nowrap;}
  .nav-section-label{display:none;}
  .brand{display:none;}
  #main{padding:16px;}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-badge">XJ</div>
      <div>
        <div class="brand-name">Sniper Journal</div>
        <div class="brand-sub">XAUUSD M15 &middot; SMC</div>
      </div>
    </div>
    <nav class="navlist" id="navlist"></nav>
  </aside>
  <main id="main">
    <div id="view-root"></div>
  </main>
</div>
<div id="overlay-root"></div>

<script>
/* =========================================================
   XAUUSD SNIPER TRADING JOURNAL
   Single-file app. Data persisted in localStorage.
   ========================================================= */

/* ---------- Constants ---------- */
const DB_TRADES = 'tj_trades_v1';
const DB_SETTINGS = 'tj_settings_v1';

const TIMEFRAMES = ['M1','M5','M15','M30','H1','H4','D1'];
const SESSIONS = ['Asia','London','NY','London/NY Overlap'];
const SYMBOLS_DEFAULT = ['XAUUSD','XAUUSD.m','GOLD'];

const MARKET_CONTEXT_ITEMS = [
  {key:'trend', label:'Trend'},
  {key:'range', label:'Range'},
  {key:'premiumDiscount', label:'Premium / Discount'},
  {key:'liquidity', label:'Liquidity'},
  {key:'sessionConfirmed', label:'Session'},
  {key:'htfBias', label:'HTF Bias'},
];
const ENTRY_CONFIRMATION_ITEMS = [
  {key:'liquiditySweep', label:'Liquidity Sweep'},
  {key:'fakeBreakout', label:'Fake Breakout'},
  {key:'chochMss', label:'CHoCH / MSS'},
  {key:'displacement', label:'Displacement'},
  {key:'fvg', label:'FVG'},
  {key:'orderBlock', label:'Order Block'},
  {key:'retest', label:'Retest'},
  {key:'prevHighLow', label:'Previous High / Low'},
];
const SNIPER_ITEMS = [
  {key:'liquidityTarget', label:'Liquidity Target'},
  {key:'sweepFakeBreak', label:'Sweep / Fake Break'},
  {key:'chochMss', label:'CHoCH / MSS'},
  {key:'displacement', label:'Displacement'},
  {key:'fvgObRetrace', label:'FVG / OB Retrace'},
];
const PSYCH_BEFORE = ['Calm','Confident','Fear','FOMO','Revenge','Bored','Overconfident'];
const PSYCH_AFTER = ['Followed Plan','Broke Plan','Early Entry','Late Entry','Moved SL','Overtrade','Revenge Trade'];
const SUGGESTED_TAGS = ['Sweep','MSS','FVG','OB','London','NY','Asia','Trend','Reversal','ASetup','BSetup','FOMO','Revenge'];

const NAV = [
  {view:'dashboard', label:'Dashboard'},
  {view:'new-trade', label:'New Trade'},
  {view:'open', label:'Open Trades', countFn:()=>trades.filter(t=>t.status==='open').length},
  {view:'history', label:'Trade History'},
  {view:'analytics', label:'Strategy Analytics'},
  {view:'psychology', label:'Psychology'},
  {view:'reports', label:'Reports'},
];

/* ---------- State ---------- */
let trades = loadTrades();
let settings = loadSettings();
let historyFilters = {symbol:'', timeframe:'', direction:'', result:'', tag:'', session:'', from:'', to:''};
let detailTab = 'overview';

function loadTrades(){
  try{ const raw = localStorage.getItem(DB_TRADES); return raw? JSON.parse(raw) : []; }
  catch(e){ console.error('loadTrades failed', e); return []; }
}
function saveTrades(){
  try{ localStorage.setItem(DB_TRADES, JSON.stringify(trades)); }
  catch(e){ alert('บันทึกไม่สำเร็จ (พื้นที่จัดเก็บเต็ม?) กรุณาลบภาพหน้าจอเก่าหรือ Export ข้อมูลสำรอง\\n' + e.message); }
}
function loadSettings(){
  try{
    const raw = localStorage.getItem(DB_SETTINGS);
    return raw? Object.assign(defaultSettings(), JSON.parse(raw)) : defaultSettings();
  }catch(e){ return defaultSettings(); }
}
function defaultSettings(){
  return { currency:'$', accountBalance:0, defaultSymbol:'XAUUSD', defaultRiskPercent:1, geminiApiKey:'', geminiModel:'gemini-2.0-flash' };
}
function saveSettings(){ localStorage.setItem(DB_SETTINGS, JSON.stringify(settings)); }

/* ---------- Utils ---------- */
function uid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function num(v){ const n = parseFloat(v); return isNaN(n)? null : n; }
function fmtN(v, d=2){ if(v===null||v===undefined||isNaN(v)) return '—'; return Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtMoney(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const s = settings.currency + fmtN(Math.abs(v),2);
  return (v<0? '-'+s : s);
}
function fmtPct(v,d=1){ if(v===null||v===undefined||isNaN(v)) return '—'; return fmtN(v,d)+'%'; }
function fmtR(v){ if(v===null||v===undefined||isNaN(v)) return '—'; return (v>=0?'+':'')+fmtN(v,2)+'R'; }
function plClass(v){ return v>0?'pos':(v<0?'neg':'neu'); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowTimeStr(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function fmtDateTime(t){ return (t.date||'—') + (t.time? ' '+t.time : ''); }
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  document.getElementById('overlay-root').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
function checked(list){ return Object.values(list||{}).filter(Boolean).length; }

/* ---------- Trade factory & calc ---------- */
function newTradeSkeleton(){
  return {
    id: uid(), status:'open', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
    date: todayStr(), time: nowTimeStr(), symbol: settings.defaultSymbol||'XAUUSD', timeframe:'M15', session:'London',
    direction:'Buy', entry:null, sl:null, tp:null, exit:null,
    lotSize:null, riskPercent: settings.defaultRiskPercent||1, riskAmount:null,
    pnl:null, pipsPoints:null, plannedRR:null, realizedR:null, commission:0, swap:0, result:null,
    marketContext:{}, entryConfirmation:{}, sniperScore:{},
    before:{bias:'Bullish', setupUsed:'', entryPoint:'', reason:'', invalidation:'', tpLocation:'', riskPlanned:'', confidence:3, screenshot:''},
    during:{movedSL:false, partialClose:false, addedLot:false, closedBeforeTP:false, revisedPlan:false, emotionDuring:'', narrative:''},
    after:{followedPlan:true, entryGood:true, slGood:true, tpGood:true, mistakes:'', wouldRepeat:true, executionScore:3, screenshot:'', psychAfter:[]},
    tags:[], notes:''
  };
}
function calcPlannedRR(entry, sl, tp){
  if(entry==null||sl==null||tp==null) return null;
  const risk = Math.abs(entry-sl), reward = Math.abs(tp-entry);
  if(risk===0) return null;
  return reward/risk;
}
function calcRealizedR(pnl, riskAmount){
  if(pnl==null||!riskAmount) return null;
  return pnl/riskAmount;
}
function suggestResult(pnl){
  if(pnl==null) return null;
  if(pnl>0) return 'Win'; if(pnl<0) return 'Loss'; return 'BE';
}
function sniperScoreOf(t){ return checked(t.sniperScore); }
function sniperVerdict(score){
  if(score>=5) return {label:'A+ SETUP', cls:'pill-a'};
  if(score===4) return {label:'STRONG SETUP', cls:'pill-a'};
  if(score===3) return {label:'B SETUP — ระวัง', cls:'pill-b'};
  return {label:'NOT TRADABLE', cls:'pill-no'};
}
function netPL(t){ return (t.pnl||0) - (t.commission||0) - (t.swap||0); }

/* ---------- Analytics ---------- */
function closedTrades(){ return trades.filter(t=>t.status==='closed'); }
function computeStats(list){
  const n = list.length;
  const wins = list.filter(t=>t.result==='Win');
  const losses = list.filter(t=>t.result==='Loss');
  const bes = list.filter(t=>t.result==='BE');
  const decided = wins.length + losses.length;
  const winRate = decided>0? wins.length/decided*100 : 0;
  const grossProfit = list.reduce((s,t)=> s + (netPL(t)>0? netPL(t):0), 0);
  const grossLoss = list.reduce((s,t)=> s + (netPL(t)<0? Math.abs(netPL(t)):0), 0);
  const profitFactor = grossLoss>0? grossProfit/grossLoss : (grossProfit>0? null : 0);
  const net = list.reduce((s,t)=> s + netPL(t), 0);
  const rs = list.map(t=>t.realizedR).filter(r=> typeof r === 'number' && !isNaN(r));
  const avgR = rs.length? rs.reduce((a,b)=>a+b,0)/rs.length : 0;
  const winRs = wins.map(t=>t.realizedR).filter(r=> typeof r==='number');
  const lossRs = losses.map(t=>t.realizedR).filter(r=> typeof r==='number');
  const avgWinR = winRs.length? winRs.reduce((a,b)=>a+b,0)/winRs.length : 0;
  const avgLossR = lossRs.length? lossRs.reduce((a,b)=>a+b,0)/lossRs.length : 0;

  const sorted = [...list].sort((a,b)=> new Date(a.date+'T'+(a.time||'00:00')) - new Date(b.date+'T'+(b.time||'00:00')));
  let running=0, peak=0, maxDD=0, peakAtMaxDD=0;
  const equityPoints=[];
  sorted.forEach(t=>{
    running += netPL(t);
    if(running>peak) peak=running;
    const dd = peak-running;
    if(dd>maxDD){ maxDD=dd; peakAtMaxDD=peak; }
    equityPoints.push(running);
  });
  const maxDDPercent = peakAtMaxDD>0? (maxDD/peakAtMaxDD*100) : 0;

  return {n, wins:wins.length, losses:losses.length, bes:bes.length, winRate, profitFactor, grossProfit, grossLoss, net, avgR, avgWinR, avgLossR, maxDD, maxDDPercent, equityPoints};
}
function groupStats(list, keyFn){
  const map = {};
  list.forEach(t=>{
    const k = keyFn(t) || '—';
    if(!map[k]) map[k]=[];
    map[k].push(t);
  });
  return Object.entries(map).map(([key,arr])=> ({key, ...computeStats(arr)})).sort((a,b)=> b.n - a.n);
}
function tagStats(list){
  const map = {};
  list.forEach(t=>{ (t.tags||[]).forEach(tag=>{ if(!map[tag]) map[tag]=[]; map[tag].push(t); }); });
  return Object.entries(map).map(([tag,arr])=> ({key:tag, ...computeStats(arr)})).sort((a,b)=> b.n - a.n);
}
function psychStats(list, phase){
  const field = phase==='before'? 'before' : 'after';
  const srcKey = phase==='before'? null : null;
  const map = {};
  list.forEach(t=>{
    let items = [];
    if(phase==='before'){ items = t.psychBefore || []; }
    else { items = (t.after && t.after.psychAfter) || []; }
    items.forEach(p=>{ if(!map[p]) map[p]=[]; map[p].push(t); });
  });
  return Object.entries(map).map(([key,arr])=> ({key, ...computeStats(arr)})).sort((a,b)=> b.n - a.n);
}
function bestWorstSetup(list){
  const ts = tagStats(list).filter(t=>t.n>=2 && (t.wins+t.losses)>0);
  if(!ts.length) return {best:null, worst:null};
  const sorted = [...ts].sort((a,b)=> b.winRate - a.winRate);
  return {best: sorted[0], worst: sorted[sorted.length-1]};
}

/* ---------- Image handling ---------- */
function fileToCompressedDataUrl(file, maxW=1000, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxW){ h = Math.round(h*maxW/w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- SVG Charts ---------- */
function emptyChart(msg){ return '<div class="empty-state" style="padding:30px;">'+esc(msg||'ยังไม่มีข้อมูลเพียงพอ')+'</div>'; }

function svgLineChart(values, opts={}){
  const w = opts.w||600, h = opts.h||200, pad=28;
  if(!values.length) return emptyChart();
  const max = Math.max(0, ...values), min = Math.min(0, ...values);
  const range = (max-min)||1;
  const toY = v => pad + ((max-v)/range) * (h-pad*2);
  const toX = i => pad + (values.length<=1? 0 : (i*(w-pad*2)/(values.length-1)));
  const pts = values.map((v,i)=> toX(i)+','+toY(v)).join(' ');
  const zeroY = toY(0);
  const areaPts = values.map((v,i)=> toX(i)+','+toY(v)).join(' L ');
  const lastX = toX(values.length-1), firstX = toX(0);
  const areaPath = 'M '+firstX+','+zeroY+' L '+areaPts+' L '+lastX+','+zeroY+' Z';
  const last = values[values.length-1];
  const strokeColor = last>=0? 'var(--green)':'var(--red)';
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;">'
    + '<line x1="'+pad+'" y1="'+zeroY+'" x2="'+(w-pad)+'" y2="'+zeroY+'" stroke="var(--border-light)" stroke-dasharray="3,3" />'
    + '<path d="'+areaPath+'" fill="'+strokeColor+'" opacity="0.12" />'
    + '<polyline points="'+pts+'" fill="none" stroke="'+strokeColor+'" stroke-width="2" />'
    + '</svg>';
}

function svgBarChart(data, opts={}){
  const w = opts.w||600, h = opts.h||220, padTop=14, padBottom=34, padSide=10;
  if(!data.length) return emptyChart();
  const max = Math.max(0, ...data.map(d=>d.value));
  const min = Math.min(0, ...data.map(d=>d.value));
  const range = (max-min)||1;
  const plotH = h-padTop-padBottom;
  const toY = v => padTop + ((max-v)/range)*plotH;
  const zeroY = toY(0);
  const gap = (w-padSide*2)/data.length;
  const barW = Math.min(46, gap*0.55);
  let bars='', labels='';
  data.forEach((d,i)=>{
    const cx = padSide + gap*i + gap/2;
    const y1 = toY(Math.max(0,d.value)), y2 = toY(Math.min(0,d.value));
    const bh = Math.max(1, y2-y1);
    const color = d.color || (d.value>=0? 'var(--green)':'var(--red)');
    bars += '<rect x="'+(cx-barW/2)+'" y="'+y1+'" width="'+barW+'" height="'+bh+'" rx="3" fill="'+color+'" />';
    const lbl = (d.label.length>9? d.label.slice(0,8)+'…' : d.label);
    labels += '<text x="'+cx+'" y="'+(h-padBottom+16)+'" font-size="10.5" fill="var(--text-dim)" text-anchor="middle">'+esc(lbl)+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;">'
    + '<line x1="'+padSide+'" y1="'+zeroY+'" x2="'+(w-padSide)+'" y2="'+zeroY+'" stroke="var(--border-light)" />'
    + bars + labels + '</svg>';
}

function svgDonut(parts, opts={}){
  const size = opts.size||160, r=size/2-14, cx=size/2, cy=size/2;
  const total = parts.reduce((s,p)=>s+p.value,0);
  if(!total) return emptyChart();
  let angle = -Math.PI/2, paths='';
  parts.forEach(p=>{
    const frac = p.value/total;
    const next = angle + frac*2*Math.PI;
    const x1 = cx+r*Math.cos(angle), y1 = cy+r*Math.sin(angle);
    const x2 = cx+r*Math.cos(next), y2 = cy+r*Math.sin(next);
    const large = (next-angle) > Math.PI ? 1 : 0;
    if(frac>0){
      paths += '<path d="M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z" fill="'+p.color+'" />';
    }
    angle = next;
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px;">'
    + paths + '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.55)+'" fill="var(--card)" />'
    + '</svg>';
}

/* ---------- Router / Render ---------- */
function navigate(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{
  if(!location.hash) location.hash = '#dashboard';
  renderNav();
  render();
});

function parseHash(){
  const h = (location.hash||'#dashboard').slice(1);
  const parts = h.split('/');
  return {view: parts[0]||'dashboard', param: parts[1]};
}

function renderNav(){
  const {view} = parseHash();
  const el = document.getElementById('navlist');
  el.innerHTML = NAV.map(n=>{
    const active = n.view===view ? ' active' : '';
    const count = n.countFn? '<span class="count">'+n.countFn()+'</span>' : '';
    return '<a class="navlink'+active+'" href="#'+n.view+'"><span>'+esc(n.label)+'</span>'+count+'</a>';
  }).join('');
}

function render(){
  renderNav();
  const {view, param} = parseHash();
  const root = document.getElementById('view-root');
  try{
    switch(view){
      case 'dashboard': root.innerHTML = viewDashboard(); break;
      case 'new-trade': root.innerHTML = viewTradeForm(param); afterTradeFormRender(param); break;
      case 'open': root.innerHTML = viewOpenTrades(); break;
      case 'history': root.innerHTML = viewHistory(); afterHistoryRender(); break;
      case 'close': root.innerHTML = viewCloseForm(param); afterCloseFormRender(param); break;
      case 'detail': root.innerHTML = viewDetail(param); break;
      case 'analytics': root.innerHTML = viewAnalytics(); break;
      case 'psychology': root.innerHTML = viewPsychology(); break;
      case 'reports': root.innerHTML = viewReports(); break;
      default: root.innerHTML = viewDashboard();
    }
  }catch(e){
    console.error(e);
    root.innerHTML = '<div class="card"><h3 class="neg">เกิดข้อผิดพลาด</h3><p>'+esc(e.message)+'</p></div>';
  }
  wireGlobalActions();
}

/* ---------- AI Autofill (Google Gemini Vision) ---------- */
async function analyzeChartImage(dataUrl){
  const match = dataUrl.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.*)$/s);
  if(!match) throw new Error('รูปแบบภาพไม่ถูกต้อง');
  const mimeType = match[1], base64 = match[2];
  const model = settings.geminiModel || 'gemini-2.0-flash';
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(settings.geminiApiKey);

  const prompt = 'You are analyzing a XAUUSD (gold) trading chart screenshot from a trader using Smart Money Concepts (SMC) / "Sniper Setup" methodology. '
    + 'Extract what is VISIBLE and CLEARLY LABELED on the chart only. Do not guess or invent numbers. '
    + 'If a price level (entry/SL/TP) is not clearly marked with a line and price label or an open order/pending order panel, set it to null. '
    + 'Only set a boolean pattern flag to true if there is clear visual evidence (e.g. a drawn box/label for FVG, Order Block, a marked swing sweep, a CHoCH/BOS label, an annotated liquidity zone). Default to false when uncertain. '
    + 'Return ONLY a single JSON object with exactly this shape (no markdown, no explanation): '
    + '{"symbol": string|null, "timeframe": one of ["M1","M5","M15","M30","H1","H4","D1"]|null, "direction": "Buy"|"Sell"|null, "entry": number|null, "sl": number|null, "tp": number|null, '
    + '"session": one of ["Asia","London","NY","London/NY Overlap"]|null, "bias": "Bullish"|"Bearish"|null, "confidence": integer 1-5|null, '
    + '"marketContext": {"trend":bool,"range":bool,"premiumDiscount":bool,"liquidity":bool,"sessionConfirmed":bool,"htfBias":bool}, '
    + '"entryConfirmation": {"liquiditySweep":bool,"fakeBreakout":bool,"chochMss":bool,"displacement":bool,"fvg":bool,"orderBlock":bool,"retest":bool,"prevHighLow":bool}, '
    + '"sniperScore": {"liquidityTarget":bool,"sweepFakeBreak":bool,"chochMss":bool,"displacement":bool,"fvgObRetrace":bool}, '
    + '"tags": [string, ...] (short tags like "Sweep","MSS","FVG","OB","London","NY","Trend","Reversal"), '
    + '"entryPoint": string (one short sentence describing where price is expected to be entered, in Thai), '
    + '"reason": string (one short sentence reasoning for the setup, in Thai) }';

  const body = {
    contents: [{ parts: [ {text: prompt}, {inline_data: {mime_type: mimeType, data: base64}} ] }],
    generationConfig: { temperature: 0.2, responseMimeType: 'application/json' }
  };

  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if(!res.ok){
    let msg = 'HTTP '+res.status;
    try{ const errJson = await res.json(); if(errJson.error && errJson.error.message) msg = errJson.error.message; }catch(e){}
    throw new Error(msg);
  }
  const data = await res.json();
  const text = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
  if(!text) throw new Error('AI ไม่ตอบข้อมูลกลับมา (อาจถูกบล็อกด้วย safety filter)');
  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if(!jsonMatch) throw new Error('อ่านผลลัพธ์จาก AI ไม่ได้');
  return JSON.parse(jsonMatch[0]);
}

function setChipsUI(containerId, hiddenId, dataAttr, values){
  const hidden = document.getElementById(hiddenId);
  const container = document.getElementById(containerId);
  if(!hidden || !container) return;
  const vals = Array.isArray(values)? values : [];
  hidden.value = JSON.stringify(vals);
  container.querySelectorAll('[data-'+dataAttr+']').forEach(chip=>{
    chip.classList.toggle('on', vals.includes(chip.dataset[dataAttr.replace(/-([a-z])/g, (m,c)=>c.toUpperCase())]));
  });
  vals.forEach(v=>{
    if(!container.querySelector('[data-'+dataAttr+'="'+v.replace(/"/g,'')+'"]')){
      const span = document.createElement('span');
      span.className = 'psych-chip on';
      span.dataset[dataAttr.replace(/-([a-z])/g, (m,c)=>c.toUpperCase())] = v;
      span.textContent = (dataAttr==='tag'? '#'+v : v);
      container.appendChild(span);
    }
  });
}

function setChecklistUI(form, prefix, items, values){
  if(!values) return;
  items.forEach(it=>{
    const el = form.querySelector('input[name="'+prefix+'_'+it.key+'"]');
    if(el) el.checked = !!values[it.key];
  });
}

function applyAIResultToForm(form, r, screenshotDataUrl){
  if(r.symbol) form.symbol.value = r.symbol;
  if(r.timeframe && TIMEFRAMES.includes(r.timeframe)) form.timeframe.value = r.timeframe;
  if(r.direction==='Buy'||r.direction==='Sell') form.direction.value = r.direction;
  if(r.session && SESSIONS.includes(r.session)) form.session.value = r.session;
  if(typeof r.entry==='number') form.entry.value = r.entry;
  if(typeof r.sl==='number') form.sl.value = r.sl;
  if(typeof r.tp==='number') form.tp.value = r.tp;
  if(r.bias==='Bullish'||r.bias==='Bearish') form.before_bias.value = r.bias;
  if(r.entryPoint) form.before_entryPoint.value = r.entryPoint;
  if(r.reason) form.before_reason.value = r.reason;
  if(r.confidence>=1 && r.confidence<=5){
    const radio = form.querySelector('input[name=before_confidence][value="'+r.confidence+'"]');
    if(radio) radio.checked = true;
  }

  setChecklistUI(form, 'mc', MARKET_CONTEXT_ITEMS, r.marketContext);
  setChecklistUI(form, 'ec', ENTRY_CONFIRMATION_ITEMS, r.entryConfirmation);
  setChecklistUI(form, 'sn', SNIPER_ITEMS, r.sniperScore);

  if(Array.isArray(r.tags) && r.tags.length) setChipsUI('tag-chips', 'tags_json', 'tag', r.tags);

  if(screenshotDataUrl){
    document.getElementById('before_screenshot').value = screenshotDataUrl;
    document.getElementById('before-shot-preview').innerHTML = '<img class="thumb" style="width:140px;height:90px;" src="'+screenshotDataUrl+'">';
  }

  refreshChecklistUI(form);
  refreshPlannedRR(form);
}

function readChecklist(form, prefix, items){
  const obj = {};
  items.forEach(it=>{
    const el = form.querySelector('input[name="'+prefix+'_'+it.key+'"]');
    obj[it.key] = !!(el && el.checked);
  });
  return obj;
}

function saveTradeFromForm(form, editId){
  const editing = editId? trades.find(t=>t.id===editId) : null;
  const t = editing || newTradeSkeleton();

  t.date = form.date.value || todayStr();
  t.time = form.time.value || nowTimeStr();
  t.symbol = form.symbol.value;
  t.timeframe = form.timeframe.value;
  t.direction = form.direction.value;
  t.session = form.session.value;
  t.entry = num(form.entry.value);
  t.sl = num(form.sl.value);
  t.tp = num(form.tp.value);
  t.lotSize = num(form.lotSize.value);
  t.riskPercent = num(form.riskPercent.value);
  t.riskAmount = num(form.riskAmount.value);
  t.plannedRR = calcPlannedRR(t.entry, t.sl, t.tp);

  t.marketContext = readChecklist(form, 'mc', MARKET_CONTEXT_ITEMS);
  t.entryConfirmation = readChecklist(form, 'ec', ENTRY_CONFIRMATION_ITEMS);
  t.sniperScore = readChecklist(form, 'sn', SNIPER_ITEMS);

  t.before = t.before || {};
  t.before.bias = form.before_bias.value;
  t.before.setupUsed = form.before_setupUsed.value;
  t.before.entryPoint = form.before_entryPoint.value;
  t.before.reason = form.before_reason.value;
  t.before.invalidation = form.before_invalidation.value;
  t.before.tpLocation = form.before_tpLocation.value;
  t.before.riskPlanned = form.before_riskPlanned.value;
  const confEl = form.querySelector('input[name=before_confidence]:checked');
  t.before.confidence = confEl? Number(confEl.value) : 3;
  t.before.screenshot = form.before_screenshot.value;

  t.tags = JSON.parse(form.tags_json.value||'[]');
  t.psychBefore = JSON.parse(form.psychBefore_json.value||'[]');
  t.notes = form.notes.value;
  t.updatedAt = new Date().toISOString();

  if(!editing){
    trades.push(t);
    saveTrades();
    toast('บันทึกเทรดใหม่แล้ว — เปิดออเดอร์');
    navigate('#detail/'+t.id);
  } else {
    saveTrades();
    toast('บันทึกการแก้ไขแล้ว');
    navigate('#detail/'+t.id);
  }
}

    const pnl = num(form.pnl.value);
    const rr = calcRealizedR(pnl, t.riskAmount);
    document.getElementById('realizedr-out').textContent = rr!==null? fmtR(rr) : '—';
  }
  form.pnl.addEventListener('input', updateRR);
  form.addEventListener('change', e=>{
    if(e.target.matches('input[type=checkbox]')){
      e.target.closest('[data-checkitem]').classList.toggle('checked', e.target.checked);

    revisedPlan: form.during_revisedPlan.checked,
    emotionDuring: form.during_emotionDuring.value,
    narrative: form.during_narrative.value
  };
  const execEl = form.querySelector('input[name=after_executionScore]:checked');
  t.after = {
    followedPlan: form.after_followedPlan.checked,
    entryGood: form.after_entryGood.checked,
    slGood: form.after_slGood.checked,
    tpGood: form.after_tpGood.checked,
    wouldRepeat: form.after_wouldRepeat.checked,
    mistakes: form.after_mistakes.value,
    executionScore: execEl? Number(execEl.value) : 3,
    screenshot: form.after_screenshot.value,
    psychAfter: JSON.parse(form.psychAfter_json.value||'[]')
  };
  t.status = 'closed';
  t.updatedAt = new Date().toISOString();
  saveTrades();
  toast('ปิดเทรดเรียบร้อย');
  navigate('#detail/'+t.id);
}

/* ---------- History ---------- */
function viewHistory(){
  const all = closedTrades();
  const uniqTags = Array.from(new Set(all.flatMap(t=>t.tags||[]))).sort();
  let list = all.filter(t=>{
    if(historyFilters.symbol && t.symbol!==historyFilters.symbol) return false;
    if(historyFilters.timeframe && t.timeframe!==historyFilters.timeframe) return false;
    if(historyFilters.direction && t.direction!==historyFilters.direction) return false;
    if(historyFilters.result && t.result!==historyFilters.result) return false;
    if(historyFilters.session && t.session!==historyFilters.session) return false;
    if(historyFilters.tag && !(t.tags||[]).includes(historyFilters.tag)) return false;
    if(historyFilters.from && t.date < historyFilters.from) return false;
    if(historyFilters.to && t.date > historyFilters.to) return false;
    return true;
  }).sort((a,b)=> new Date(b.date+'T'+(b.time||'00:00')) - new Date(a.date+'T'+(a.time||'00:00')));

  const uniqSymbols = Array.from(new Set(trades.map(t=>t.symbol))).sort();

  return ''
  + '<div class="page-header"><div><h1 class="page-title">Trade History</h1><div class="page-sub">'+list.length+' / '+all.length+' รายการ</div></div></div>'
  + '<div class="card" style="margin-bottom:14px;">'
  + '<div class="filter-bar">'
    + filterSelect('f-symbol','Symbol', ['',...uniqSymbols], historyFilters.symbol)
    + filterSelect('f-timeframe','Timeframe', ['',...TIMEFRAMES], historyFilters.timeframe)
    + filterSelect('f-direction','Direction', ['','Buy','Sell'], historyFilters.direction)
    + filterSelect('f-result','Result', ['','Win','Loss','BE'], historyFilters.result)
    + filterSelect('f-session','Session', ['',...SESSIONS], historyFilters.session)
    + filterSelect('f-tag','Tag', ['',...uniqTags], historyFilters.tag)
    + '<div class="field"><label>จาก</label><input type="date" id="f-from" value="'+esc(historyFilters.from)+'"></div>'
    + '<div class="field"><label>ถึง</label><input type="date" id="f-to" value="'+esc(historyFilters.to)+'"></div>'
    + '<button class="btn btn-ghost btn-sm" id="f-clear" type="button">ล้างตัวกรอง</button>'
  + '</div></div>'
  + (list.length? '<div class="card"><div class="table-wrap"><table><thead><tr>'
    + '<th>วันที่</th><th>Symbol</th><th>TF</th><th>Dir</th><th>Entry</th><th>Exit</th><th>P/L</th><th>R</th><th>Result</th><th>Tags</th>'
    + '</tr></thead><tbody>'
    + list.map(t=>{
        const n = netPL(t);
        return '<tr class="row-click" data-goto="#detail/'+t.id+'">'
        + '<td>'+esc(fmtDateTime(t))+'</td>'
        + '<td>'+esc(t.symbol)+'</td><td>'+esc(t.timeframe)+'</td>'
        + '<td><span class="badge badge-'+(t.direction==='Buy'?'buy':'sell')+'">'+t.direction+'</span></td>'
        + '<td>'+fmtN(t.entry,2)+'</td><td>'+fmtN(t.exit,2)+'</td>'
        + '<td class="'+plClass(n)+'">'+fmtMoney(n)+'</td>'
        + '<td class="'+plClass(t.realizedR||0)+'">'+fmtR(t.realizedR)+'</td>'
        + '<td><span class="badge badge-'+(t.result==='Win'?'win':t.result==='Loss'?'loss':'be')+'">'+(t.result||'—')+'</span></td>'
        + '<td>'+(t.tags||[]).slice(0,3).map(tg=>'<span class="tag-chip">#'+esc(tg)+'</span>').join('')+'</td>'

    + (findInsight(before, after) || '<div class="empty-state">บันทึกเทรดให้ครบ Psychology มากขึ้นเพื่อดูรูปแบบ</div>')
  + '</div>';

function findInsight(before, after){
  const all = [...before, ...after].filter(x=>x.n>=2 && (x.wins+x.losses)>0);
  if(!all.length) return '';
  const worst = [...all].sort((a,b)=>a.winRate-b.winRate)[0];
  const best = [...all].sort((a,b)=>b.winRate-a.winRate)[0];
  let html='';
  if(worst) html += '<p>🔻 <b>'+esc(worst.key)+'</b> → Win Rate '+fmtPct(worst.winRate)+' (Loss Rate '+fmtPct(100-worst.winRate)+') จาก '+worst.n+' เทรด — ควรระวังเป็นพิเศษ</p>';
  if(best && best.key!==worst.key) html += '<p>✅ <b>'+esc(best.key)+'</b> → Win Rate '+fmtPct(best.winRate)+' จาก '+best.n+' เทรด — สภาวะที่ทำผลงานดีที่สุด</p>';
  return html;
}

function wireGlobalActions(){
  const root = document.getElementById('view-root');

  const settingsForm = document.getElementById('settings-form');
  if(settingsForm){
    settingsForm.addEventListener('submit', e=>{
      e.preventDefault();
      settings.currency = settingsForm.currency.value || '$';
      settings.accountBalance = num(settingsForm.accountBalance.value) || 0;
      settings.defaultSymbol = settingsForm.defaultSymbol.value || 'XAUUSD';
      settings.defaultRiskPercent = num(settingsForm.defaultRiskPercent.value) || 1;
      settings.geminiApiKey = settingsForm.geminiApiKey.value.trim();
      settings.geminiModel = settingsForm.geminiModel.value.trim() || 'gemini-2.0-flash';
      saveSettings();
      toast('บันทึกการตั้งค่าแล้ว');
    });
  }

  const expJson = document.getElementById('btn-export-json');
  if(expJson) expJson.addEventListener('click', exportJSON);
  const expCsv = document.getElementById('btn-export-csv');
  if(expCsv) expCsv.addEventListener('click', exportCSV);
  const impFile = document.getElementById('import-file');
  if(impFile) impFile.addEventListener('change', handleImportFile);
  const resetBtn = document.getElementById('btn-reset-all');
  if(resetBtn) resetBtn.addEventListener('click', confirmResetAll);

  const delBtn = document.getElementById('del-trade-btn');
  if(delBtn) delBtn.addEventListener('click', ()=> confirmDeleteTrade(delBtn.dataset.id));

  root.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ detailTab = btn.dataset.tab; render(); });
  });

  root.querySelectorAll('[data-lightbox]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const box = document.createElement('div');
      box.className='lightbox';
      box.innerHTML = '<img src="'+img.src+'">';
      box.addEventListener('click', ()=> box.remove());
      document.getElementById('overlay-root').appendChild(box);
    });
  });
}

function exportCSV(){
  const cols = ['date','time','symbol','timeframe','session','direction','entry','sl','tp','exit','lotSize','riskPercent','riskAmount','pnl','commission','swap','pipsPoints','plannedRR','realizedR','result','tags','status'];
  const lines = [cols.join(',')];
  closedTrades().concat(trades.filter(t=>t.status==='open')).forEach(t=>{
    const row = cols.map(c=>{
      let v = c==='tags'? (t.tags||[]).join('|') : t[c];
      if(v===null||v===undefined) v='';
      v = String(v).replace(/"/g,'""');
      return /[,"\\n]/.test(v)? '"'+v+'"' : v;
    });
    lines.push(row.join(','));
  });
  const blob = new Blob([lines.join('\\n')], {type:'text/csv'});
  downloadBlob(blob, 'trading-journal-'+todayStr()+'.csv');
  toast('Export CSV สำเร็จ');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function handleImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      const incoming = Array.isArray(data)? data : (data.trades||[]);
      if(!Array.isArray(incoming)) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
      showConfirm('นำเข้าข้อมูล '+incoming.length+' เทรด — ต้องการรวมกับข้อมูลเดิม หรือแทนที่ทั้งหมด?', [
        {label:'รวมกับข้อมูลเดิม', action:()=>{
          const existingIds = new Set(trades.map(t=>t.id));
          incoming.forEach(t=>{ if(!existingIds.has(t.id)) trades.push(t); });
          saveTrades(); toast('นำเข้าและรวมข้อมูลแล้ว'); render();
        }},
        {label:'แทนที่ทั้งหมด', danger:true, action:()=>{
          trades = incoming; saveTrades(); toast('แทนที่ข้อมูลทั้งหมดแล้ว'); render();
        }},
      ]);
      if(data.settings){ settings = Object.assign(defaultSettings(), data.settings); saveSettings(); }
    }catch(err){ alert('นำเข้าไม่สำเร็จ: '+err.message); }
  };
  reader.readAsText(file);
}

function confirmResetAll(){
  showConfirm('ยืนยันล้างข้อมูลเทรดทั้งหมด? ไม่สามารถกู้คืนได้ (แนะนำ Export JSON สำรองก่อน)', [
    {label:'ยกเลิก'},
    {label:'ล้างข้อมูลทั้งหมด', danger:true, action:()=>{ trades=[]; saveTrades(); toast('ล้างข้อมูลแล้ว'); navigate('#dashboard'); }},
  ]);
}
function confirmDeleteTrade(id){
  showConfirm('ยืนยันลบเทรดนี้?', [
    {label:'ยกเลิก'},
    {label:'ลบ', danger:true, action:()=>{ trades = trades.filter(t=>t.id!==id); saveTrades(); toast('ลบแล้ว'); navigate('#history'); }},
  ]);
}
function showConfirm(msg, actions){
  const bg = document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = '<div class="modal-box"><h3>ยืนยัน</h3><p>'+esc(msg)+'</p><div class="modal-actions"></div></div>';
  const actionsEl = bg.querySelector('.modal-actions');
  actions.forEach(a=>{
    const btn = document.createElement('button');
    btn.className = 'btn ' + (a.danger? 'btn-danger':'btn-ghost');
    btn.textContent = a.label;
    btn.addEventListener('click', ()=>{ bg.remove(); if(a.action) a.action(); });
    actionsEl.appendChild(btn);
  });
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
  document.getElementById('overlay-root').appendChild(bg);
}
</script>
