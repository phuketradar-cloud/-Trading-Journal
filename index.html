<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPS Tracking Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-card">
    <h1>GPS Tracking</h1>
    <p class="subtitle">Web Dashboard</p>
    <label>Username</label>
    <input type="text" id="loginUsername" autocomplete="username" required />
    <label>Password</label>
    <input type="password" id="loginPassword" autocomplete="current-password" required />
    <button type="submit">Sign in</button>
    <div id="loginError" class="error-text" hidden></div>
  </form>
</div>

<!-- ===================== MAIN APP ===================== -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">GPS Tracking Dashboard</div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="live">Live Map</button>
      <button class="tab-btn" data-tab="history">History &amp; Playback</button>
      <button class="tab-btn" data-tab="geofences">Geofences</button>
      <button class="tab-btn" data-tab="alerts">Alerts <span id="alertBadge" class="badge" hidden>0</span></button>
      <button class="tab-btn admin-only" data-tab="admin" hidden>Admin</button>
    </nav>
    <div class="user-info">
      <span id="userLabel"></span>
      <button id="logoutBtn" class="btn-ghost">Sign out</button>
    </div>
  </header>

  <main class="layout">
    <!-- Sidebar: device list -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <input type="text" id="deviceSearch" placeholder="ค้นหาอุปกรณ์..." />
      </div>
      <ul id="deviceList" class="device-list"></ul>
    </aside>

    <!-- Live Map tab -->
    <section id="tab-live" class="tab-panel active">
      <div id="map" class="map"></div>
    </section>

    <!-- History & Playback tab -->
    <section id="tab-history" class="tab-panel">
      <div class="history-controls">
        <label>อุปกรณ์
          <select id="historyDevice"></select>
        </label>
        <label>วันที่
          <input type="date" id="historyDate" />
        </label>
        <label>เวลาเริ่ม
          <input type="time" id="historyFrom" value="00:00" />
        </label>
        <label>เวลาสิ้นสุด
          <input type="time" id="historyTo" value="23:59" />
        </label>
        <button id="loadHistoryBtn">Load</button>
        <div class="export-group">
          Export:
          <button data-format="csv" class="export-btn">CSV</button>
          <button data-format="xlsx" class="export-btn">Excel</button>
          <button data-format="pdf" class="export-btn">PDF</button>
          <button data-format="json" class="export-btn">JSON</button>
        </div>
      </div>

      <div class="history-body">
        <div id="historyMap" class="map map-small"></div>
        <div class="history-side">
          <div id="summaryPanel" class="summary-panel"></div>
          <div class="playback-controls">
            <button id="playBtn">▶ Play</button>
            <input type="range" id="playbackSlider" min="0" max="0" value="0" />
            <span id="playbackTime">--:--:--</span>
            <select id="playbackSpeed">
              <option value="1">1x</option>
              <option value="5">5x</option>
              <option value="20">20x</option>
              <option value="60">60x</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- Geofences tab -->
    <section id="tab-geofences" class="tab-panel">
      <div class="geofence-toolbar">
        <button id="newGeofenceBtn">+ New geofence (circle, click map)</button>
        <span id="geofenceHint" class="hint"></span>
      </div>
      <div id="geofenceMap" class="map"></div>
      <ul id="geofenceList" class="geofence-list"></ul>
    </section>

    <!-- Alerts tab -->
    <section id="tab-alerts" class="tab-panel">
      <table class="alert-table">
        <thead>
          <tr><th>Time</th><th>Device</th><th>Type</th><th>Severity</th><th>Message</th><th>Ack</th></tr>
        </thead>
        <tbody id="alertTableBody"></tbody>
      </table>
    </section>

    <!-- Admin tab -->
    <section id="tab-admin" class="tab-panel">
      <h2>Users</h2>
      <form id="newUserForm" class="inline-form">
        <input type="text" id="newUsername" placeholder="username" required />
        <input type="password" id="newPassword" placeholder="password" required />
        <input type="text" id="newFullName" placeholder="full name" required />
        <select id="newRole">
          <option value="admin">admin</option>
          <option value="operator" selected>operator</option>
          <option value="viewer">viewer</option>
          <option value="driver">driver</option>
        </select>
        <button type="submit">Create user</button>
      </form>
      <table class="alert-table">
        <thead><tr><th>Username</th><th>Full name</th><th>Role</th><th>Active</th><th>Created</th></tr></thead>
        <tbody id="userTableBody"></tbody>
      </table>

      <h2>Audit Log</h2>
      <table class="alert-table">
        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th></tr></thead>
        <tbody id="auditTableBody"></tbody>
      </table>
    </section>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/map.js"></script>
<script src="js/devices.js"></script>
<script src="js/history.js"></script>
<script src="js/geofences.js"></script>
<script src="js/alerts.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
